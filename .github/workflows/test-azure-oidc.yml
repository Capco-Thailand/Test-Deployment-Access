name: Test Azure OIDC access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-login:
    runs-on: ubuntu-latest
    environment: sandbox

    steps:
      - name: Check Azure configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          test -n "$CLIENT_ID" || { echo "::error::AZURE_CLIENT_ID is empty"; exit 1; }
          test -n "$TENANT_ID" || { echo "::error::AZURE_TENANT_ID is empty"; exit 1; }
          test -n "$SUBSCRIPTION_ID" || { echo "::error::AZURE_SUBSCRIPTION_ID is empty"; exit 1; }
      - name: Sign in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm target subscription
        run: az account show --query "{name:name,id:id,tenantId:tenantId}" --output table
